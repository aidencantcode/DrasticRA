name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK; just make sure licenses are accepted
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Fetch rcheevos (newest v11.x release)
        run: |
          git clone https://github.com/RetroAchievements/rcheevos app/src/main/cpp/rcheevos
          cd app/src/main/cpp/rcheevos
          TAG=$(git tag -l 'v11.*' --sort=-v:refname | head -n1)
          echo "rcheevos tag: ${TAG:-<default branch>}"
          if [ -n "$TAG" ]; then git checkout "$TAG"; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DrasticRA-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DrasticRA-build${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" \
            "DrasticRA-build${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Drastic RA build ${{ github.run_number }}" \
            --notes "Automated build of commit ${{ github.sha }}"
